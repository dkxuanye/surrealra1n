name: Build wdi-simple (Windows)

# 产出 wdi-simple.exe（libwdi 官方命令行示例，用于 DFU 驱动静默安装）
# 构建配方复刻 libwdi 官方 .github/workflows/mingw.yml（x86_64 单架构）
on:
  push:
    paths:
      - ".github/workflows/build-wdi-simple.yml"
  workflow_dispatch:

env:
  WDK_URL: https://go.microsoft.com/fwlink/p/?LinkID=253170
  LIBUSB0_URL: https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.0/libusb-win32-bin-1.4.0.0.zip
  LIBUSBK_URL: https://github.com/mcuee/libusbk/releases/download/V3.1.0.0/libusbK-3.1.0.0-bin.7z
  BUILD_OPTIONS: '--enable-toggable-debug --enable-examples-build --disable-debug --disable-shared'
  DRIVERS_PATHS: '--with-wdkdir="wdk/Windows Kits/8.0" --with-wdfver=1011 --with-libusb0="libusb0" --with-libusbk="libusbk/bin"'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            base-devel
            autotools
            git
            p7zip

      - name: Checkout libwdi
        uses: actions/checkout@v4
        with:
          repository: pbatard/libwdi
          fetch-depth: 1
          submodules: recursive

      - name: Download support files (WDK8 / libusb0 / libusbK)
        shell: cmd
        run: |
          curl -L %WDK_URL% -o wdk-redist.msi
          curl -L %LIBUSB0_URL% -o libusb0-redist.zip
          curl -L %LIBUSBK_URL% -o libusbk-redist.7z
          msiexec /a wdk-redist.msi /qn TARGETDIR=%CD%\wdk
          7z x libusb0-redist.zip
          7z x libusbk-redist.7z
          move libusb-win32* libusb0
          move libusbK* libusbk

      - name: Build
        shell: msys2 {0}
        run: |
          ./bootstrap.sh
          ./configure --build=x86_64-w64-mingw32 --host=x86_64-w64-mingw32 $BUILD_OPTIONS --disable-32bit $DRIVERS_PATHS
          make -j"$(nproc)"
          ls -la examples/*.exe

      - name: Smoke test (print usage)
        shell: msys2 {0}
        run: ./examples/wdi-simple.exe --help || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wdi-simple-windows-x64
          path: examples/wdi-simple.exe
          if-no-files-found: error
